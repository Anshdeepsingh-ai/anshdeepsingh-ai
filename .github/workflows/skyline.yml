name: Generate 3D Contribution Skyline

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-3d-skyline
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution graphics
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Show generated files
        run: |
          echo "Generated files:"
          find profile-3d-contrib -maxdepth 1 -type f -print

      - name: Commit generated skyline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update 3D contribution skyline"
            git push
          fi
