name: Update Recent Activity

on:
  schedule:
    - cron: "0 */12 * * *"   # twice daily — plenty for "Recent Activity" freshness
  workflow_dispatch: {}

concurrency:
  group: update-recent-activity
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update activity section in README
        uses: jamesgeorge007/github-activity-readme@v0.4.5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
